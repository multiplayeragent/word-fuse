<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Word Fuse</title>
<style>
  :root { --bg: #14121f; --panel: #241f3a; --ink: #fff; --dim: #b9b2d8; --gold: #ffd23f; --ok: #45e08a; --bad: #ff5468; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { background: radial-gradient(700px 500px at 50% 40%, #3a2a66, transparent 70%), var(--bg); color: var(--ink);
         font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; }
  #app { height: 100%; display: flex; flex-direction: column; gap: 8px; max-width: 820px; margin: 0 auto; box-sizing: border-box;
         padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  header { display: flex; align-items: center; gap: 10px; min-height: 40px; }
  header h1 { margin: 0; font-size: 20px; white-space: nowrap; } header h1 b { color: var(--gold); }
  #status { color: var(--dim); font-weight: 700; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #name { width: 120px; height: 36px; margin-left: auto; flex: none; border-radius: 10px; border: 1px solid #ffffff33; background: #ffffff14; color: #fff; padding: 0 10px; font: inherit; font-size: 16px; box-sizing: border-box; }
  #stage { position: relative; flex: 1; min-height: 0; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #alpha { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; align-items: center; font-size: 11px; font-weight: 800; }
  #alpha i { font-style: normal; width: 17px; height: 20px; line-height: 20px; text-align: center; border-radius: 4px; background: #ffffff10; color: #ffffff55; }
  #alpha i.on { background: var(--gold); color: #2a1f00; }
  #alpha span { color: var(--dim); font-weight: 700; margin-left: 6px; }
  #row { display: flex; gap: 8px; }
  #word { flex: 1; min-width: 0; height: 52px; border-radius: 14px; border: 2px solid #ffffff33; background: #ffffff12; color: #fff; padding: 0 14px; font: 800 22px system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; box-sizing: border-box; outline: none; }
  #word:focus { border-color: #ffffff66; }
  #word::placeholder { text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 17px; color: #ffffff66; }
  #word.turn { border-color: var(--gold); background: #ffd23f1a; }
  #word.bad { border-color: var(--bad); animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #go { width: 84px; height: 52px; border: 0; border-radius: 14px; background: var(--gold); color: #2a1f00; font: 900 18px system-ui, sans-serif; cursor: pointer; flex: none; }
  #go:disabled { opacity: .35; }
  #hint { text-align: center; font-size: 13px; color: var(--dim); min-height: 18px; }
  #hint.bad { color: var(--bad); font-weight: 700; } #hint.ok { color: var(--ok); font-weight: 700; }
  #net { text-align: center; font-size: 12px; color: var(--dim); opacity: .8; min-height: 16px; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #0a0812cc; }
  #over[hidden] { display: none; }
  .card { width: min(380px, calc(100vw - 32px)); max-height: 86vh; overflow: auto; padding: 20px; border-radius: 18px; background: var(--panel); border: 2px solid #ffffff2a; box-sizing: border-box; }
  .card h2 { margin: 0 0 6px; font-size: 22px; color: var(--gold); }
  .card h3 { margin: 14px 0 4px; font-size: 14px; color: #ffb3c8; }
  .card ol { margin: 0; padding-left: 24px; font-size: 14px; }
  .card li span { float: right; font-variant-numeric: tabular-nums; }
  .card li.me { color: var(--gold); font-weight: 700; }
  .card li.note { list-style: none; opacity: .75; }
  .card p { margin: 10px 0; font-size: 13px; opacity: .85; }
  button.again { width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: var(--gold); color: #2a1f00; font: 800 17px system-ui, sans-serif; cursor: pointer; }
  @media (max-width: 520px) { #name { width: 100px; } header h1 { font-size: 18px; } #alpha { gap: 2px; } #alpha i { width: 14px; font-size: 10px; } #alpha span { display: none; } }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<div id="app">
  <header><h1>Word <b>Fuse</b></h1><span id="status"></span><input id="name" maxlength="16" placeholder="Your name" aria-label="Your name"></header>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="alpha"></div>
  <div id="row"><input id="word" maxlength="24" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="Type a word…" aria-label="Your word"><button id="go">GO</button></div>
  <div id="hint"></div>
  <div id="net">Connecting…</div>
</div>
<div id="over" hidden><div class="card">
  <h2 id="title">Game over</h2><p id="best"></p>
  <ol id="results"></ol>
  <h3>Most wins</h3><ol id="board"><li class="note">Loading…</li></ol>
  <p id="next"></p>
  <button class="again" id="again">Play again</button>
</div></div>

<script>
/* ═══ WORD FUSE · a Multiplayer Agent starter ══════════════════════════════════════════
 * A ticking bomb passes around a circle of players. On your turn, type a word that contains
 * the letters on the bomb ("ING", "TR") before it pops. No repeats. Two lives each; use every
 * letter of the bonus alphabet to earn one back. Last one standing wins. Word, 2–12 players.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ lives, the fuse, prompt difficulty, bonus letters, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   WORDS ......... isWord(), the prompt picker
 *   GAME (HOST) ... turns, the hidden fuse, checking words, lives, the bots.
 *                   Only the host writes `game`, `used` and `bt`.
 *   MY TURN ....... typing (shown to everyone as you type) and submitting a word
 *   CIRCLE ........ the canvas: players round the table, the bomb, the fuse, the blast
 *   HUD & RESULTS . status line, bonus letters, results card, leaderboard
 *   SOUND ......... WebAudio ticks, dings and the boom
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The game lives in ONE shared field, `game`: {id, v, phase, seats, lives, let, wc, best,
 *     turn, k, prompt, turnAt, fuseAt, endsAt, last, bang, win}. Only the HOST writes it; `v`
 *     goes up on every write. `seats` = [[id, name, color], ...] round the circle (bots: "@" ids).
 *   - `used` = {g, w}: the words already played this game. `bt` = {g, k, s}: what the bot whose
 *     turn it is has typed so far. Both host-written.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s). The
 *     fuse is a timestamp (`fuseAt`, random, at least a few seconds per turn): the host pops the
 *     bomb when its clock passes it, so a new host carries on with the same bomb.
 *   - Each player writes its OWN entity: `n`, `c` (name, color), `hb` (heartbeat) and `ty` =
 *     {g, k, s}: what it is typing on its turn (everyone watches the letters appear).
 *   - Intents to the host: "word" {g, k, w} (my answer for turn k) and "again". The host checks
 *     the word (has the letters, in the list, not used) and passes the bomb, or writes why not
 *     into `last` so the typer sees it.
 *   - Late arrivals watch and join the next game.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "bomb-wins": games won (submitted with "inc"), on the results card.

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {

  maxSeats: 12,          // more people than this watch until a seat frees up
  lives: 2,              // lives at the start
  maxLives: 3,           // the bonus alphabet can't take you above this
  lobbyMs: 5000,         // countdown before a game
  boomMs: 2000,          // pause after the bomb pops
  resultsMs: 11000,      // results card before the next game
  fuseMin: 9, fuseMax: 20, // seconds a bomb burns (random and hidden)...
  minTurn: 4,            // ...but every turn gets at least this many seconds
  promptEasy: 60,        // the first prompts appear in at least this many listed words
  promptHard: 12,        // later prompts get rarer, down to this many words
  hardenPerTurn: 2,      // how fast prompts get harder (words fewer per turn played)
  bonusLetters: "ABCDEFGHIJLMNOPRSTUVWY", // use them all in your words for an extra life (no K Q X Z)
  botThinkMin: 1500, botThinkMax: 4200, // ms a bot thinks before typing

const BOT_NAMES = ["Wordy", "Lexi", "Scrabbs", "Ink", "Vowel", "Syllabo", "Quill", "Rhyme", "Prose", "Dexter", "Penny", "Atlas"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {

  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',

const seenHb = new Map();

    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });

const isHost = () => livePlayers()[0] === net.sessionId && performance.now() - host.wokeAt > 700 && performance.now() - host.frameAt < 1000;

// ── WORDS ───────────────────────────────────────────────────────────────────────────

    if (!w.endsWith(end)) continue;
    const b = w.slice(0, -end.length);
    if (listed(b) || listed(b + "e")) return true;
    if (b.length > 3 && b.at(-1) === b.at(-2) && listed(b.slice(0, -1))) return true; // running, bigger
    if (end !== "ing" && b.endsWith("i") && listed(b.slice(0, -1) + "y")) return true; // tried, happier, happily

function isWord(w) {

  if (DICT.has(w) || grown(w)) return true;
  const plain = (b) => DICT.has(b) || grown(b);
  if (w.endsWith("ies") && plain(w.slice(0, -3) + "y")) return true;
  if (w.endsWith("es") && /(s|x|z|ch|sh)$/.test(w.slice(0, -2)) && plain(w.slice(0, -2))) return true;
  return w.endsWith("s") && !/(s|x|z|ch|sh|y)$/.test(w.slice(0, -1)) && plain(w.slice(0, -1)) || (w.endsWith("ys") && plain(w.slice(0, -1)) && /[aeiou]ys$/.test(w));
}
/** Every 2- and 3-letter chunk, with how many listed words contain it: the prompt pool. */
const CHUNKS = (() => {
  const count = new Map();
  for (const w of WORDS) {
    const seen = new Set();
    for (let len = 2; len <= 3; len++) for (let i = 0; i + len <= w.length; i++) seen.add(w.slice(i, i + len));

  if (used.has(w)) return `${w.toUpperCase()} was already used`;

// ── GAME (HOST) ─────────────────────────────────────────────────────────────────────
const host = { last: null, frameAt: 0, wokeAt: -1e9, bot: null, usedLast: null, btLast: "" };
/** The game as state has it, or the host's own newer write that hasn't come back yet. `v` only goes up. */

}
function writeGame(g) { g = { ...g, v: (game()?.v ?? 0) + 1 }; host.last = g; net.setShared("game", JSON.stringify(g)); return g; }
/** The words played this game (a Set), from `used` (or the host's newer copy). */
function usedWords(g) {

}
const rand = (a, b) => a + Math.random() * (b - a);
const alive = (g) => g.seats.map((_, i) => i).filter((i) => g.lives[i] > 0);

/** A new game: a lobby countdown with everyone here and bots up to the seats. */
/** Live people whose name has arrived (a seat keeps the name it was given). */
const seatable = () => livePlayers().filter((id) => id === net.sessionId || S.entities.players[id]?.n);
function newGame(id) {
  const people = seatable().slice(0, CONFIG.maxSeats), names = [...BOT_NAMES].sort(() => Math.random() - 0.5);
  const used = new Set(people.map(colorOf)), free = COLORS.filter((c) => !used.has(c));
  const seats = [...people.map((id) => [id, nameOf(id).slice(0, 12), colorOf(id)]), ...Array.from({ length: Math.max(0, CONFIG.seats - people.length) }, (_, i) => ["@" + (i + 1), names[i], free[i] || COLORS[i]])];

  writeUsed({ id }, new Set());
  return writeGame({ id, phase: "lobby", seats, lives: Array(n).fill(CONFIG.lives), let: Array(n).fill(""), wc: Array(n).fill(0), best: null,

}
/** People who arrive during the lobby take a bot's seat (or a new one, up to maxSeats); renamed people get their new name. */
function seatLatecomers(g) {
  const fresh = seatable().filter((id) => !g.seats.some((s) => s[0] === id));
  const renamed = g.seats.some((s) => !isBot(s[0]) && S.entities.players[s[0]]?.n && (s[1] !== nameOf(s[0]).slice(0, 12) || s[2] !== colorOf(s[0])));

}
/** A fresh bomb (random hidden fuse) in front of seat `turn`. */

  return writeGame({ ...g, phase: "play", turn, k: g.k + 1, prompt: pickPrompt(g.k, g.prompt), turnAt: t, fuseAt: t + fuse });
}

    if (t < g.endsAt) return;
    const left = alive(g);

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("word", (m, from) => { const g = game(); if (isHost() && g && m && typeof m === "object" && m.g === g.id) applyWord(g.seats.findIndex((s) => s[0] === from), m.k, m.w); });
  net.on("again", () => { const g = game(); if (isHost() && g) playAgain(g); });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  fit();
  requestAnimationFrame(frame);
})();
</script>
